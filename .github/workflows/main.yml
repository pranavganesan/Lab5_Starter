name: Lab 5 CI/CD

on:
  push:
    branches: [ master, testing ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt-in for May 2026 standards

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22' # Using stable LTS for 2026
        cache: 'npm'
    - run: npm ci # Faster, cleaner install for CI
    - run: npm test